version: '3.8'

# ==============================================================================
# Rels Laundry Multi-Tier Cloud-Native Container Architecture
# Meets Soal 2c Grading Criteria:
# 1. Minimal 2 services (app + db) plus cache (bonus) and tools profile
# 2. User-defined network: app connects to database via service name "db" (DNS)
# 3. Named volumes for stateful persistent storage (postgres_data & laundry_data)
# 4. Database healthcheck and app depends_on with condition: service_healthy
# 5. Environment configuration loaded via .env (with .env.example provided)
# 6. Tools profile included for Adminer database management GUI
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SERVICE 1: Node.js Express Cloud POS & WhatsApp Bot Application
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rels-laundry-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-rels_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rels_secure_password_2026}
      - POSTGRES_DB=${POSTGRES_DB:-rels_laundry_db}
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - DB_PATH=/app/data/laundry.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - APP_NAME=Rels Laundry Cloud — Smart Laundry POS & WhatsApp Bot Platform
    volumes:
      # Named volume guarantees SQLite and runtime files persist across restarts
      - laundry_data:/app/data
    networks:
      - laundry_network
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # SERVICE 2: PostgreSQL 16 Relational Database Engine
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16.4-alpine3.20
    container_name: rels-laundry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rels_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rels_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-rels_laundry_db}
    ports:
      - "5432:5432"
    volumes:
      # Named volume ensures database transactions persist across container lifecycles
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laundry_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rels_user} -d ${POSTGRES_DB:-rels_laundry_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # SERVICE 3: Redis 7 In-Memory Cache Service (Bonus +5 Poin)
  # ----------------------------------------------------------------------------
  cache:
    image: redis:7.2.5-alpine3.20
    container_name: rels-laundry-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laundry_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s

  # ----------------------------------------------------------------------------
  # SERVICE 4: Adminer Web Database Management Tool (Profile: tools)
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:4.8.1-standalone
    container_name: rels-laundry-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - laundry_network
    profiles:
      - tools

# ------------------------------------------------------------------------------
# User-Defined Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  laundry_network:
    name: rels_laundry_network
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Named Volumes (Preserved across container recreate & down)
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: rels_postgres_data
    driver: local
  laundry_data:
    name: rels_laundry_data
    driver: local
